name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: test + verify + package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No runtime or dev dependencies — nothing to install.
      - name: Show environment
        run: node --version

      - name: Test
        run: npm test

      # Composes all four store items and runs scripts/verify.mjs against each
      # staged package before zipping it, so there is no separate verify step:
      # verifying the source trees would be meaningless now that the shell lives
      # in shared/ and is only assembled at build time.
      - name: Build + verify all four packages
        run: npm run build

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload store packages
        uses: actions/upload-artifact@v4
        with:
          name: chat2md-packages-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
